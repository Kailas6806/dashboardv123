name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 30 minutes to ensure the app never goes to sleep
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging https://dashboardv123.streamlit.app/ to keep it awake..."
          curl -sS https://dashboardv123.streamlit.app/ > /dev/null
          echo "Ping complete."
