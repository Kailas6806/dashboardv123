[server]
headless = true
address = "0.0.0.0"
port = 8501
runOnSave = false
maxUploadSize = 5
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#06070D"
secondaryBackgroundColor = "#0D0F18"
textColor = "#F8FAFC"
font = "sans serif"

[client]
toolbarMode = "minimal"
